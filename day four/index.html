<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4 Assignment - Note Draft</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Note Draft App</h1>
            <button id="theme-toggle">Dark mode</button>
        </header>

        <div class="input-group">
            <label for="note-text">Your Note:</label>
            <textarea id="note-text" placeholder="Type your notes here..."></textarea>
        </div>

        <div class="stats">
            <p id="char-count">0 / 200 characters</p>
            <p id="word-count">0 words</p>
        </div>

        <button id="clear-btn">Clear</button>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
