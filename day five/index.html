<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 Assignment - User Directory</title>
    <script src="users.js" defer></script>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .controls { margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        input, button { padding: 8px; font-size: 1rem; }
        #status { font-style: italic; color: #555; }
        ul { list-style: none; padding: 0; }
        li { background: #f9f9f9; border: 1px solid #ddd; padding: 12px; margin-bottom: 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>User Directory</h1>
    
    <div class="controls">
        <button id="load-users">Load Users</button>
        <div>
            <label for="filter-input">Filter by name: </label>
            <input type="text" id="filter-input" placeholder="Type to filter..." />
        </div>
    </div>

    <p id="status">Click "Load Users" to fetch data.</p>
    <ul id="users-list"></ul>
</body>
</html>
